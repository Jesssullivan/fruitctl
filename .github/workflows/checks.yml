name: Core checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fruitctl-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare owned fixture runtime
        id: runtime
        shell: bash
        run: |
          umask 077
          # A short private path keeps fixture Unix sockets within Linux limits.
          runtime="$(mktemp -d /tmp/fruitctl-ci.XXXXXX)"
          echo "TMPDIR=$runtime" >> "$GITHUB_ENV"
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
          echo "identity=$(stat -c '%d:%i:%u' "$runtime")" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 scripts/release/test_native_input.py
      - run: python3 scripts/release/test_release.py
      - run: npm run docs:check
      - run: git diff --check
      - name: Remove owned fixture runtime
        if: always() && steps.runtime.outputs.path != ''
        shell: bash
        env:
          FRUITCTL_CI_RUNTIME: ${{ steps.runtime.outputs.path }}
          FRUITCTL_CI_RUNTIME_IDENTITY: ${{ steps.runtime.outputs.identity }}
        run: |
          test "$TMPDIR" = "$FRUITCTL_CI_RUNTIME"
          [[ "$TMPDIR" == /tmp/fruitctl-ci.?????? ]]
          test -d "$TMPDIR" && test ! -L "$TMPDIR"
          test "$(stat -c '%d:%i:%u' "$TMPDIR")" = "$FRUITCTL_CI_RUNTIME_IDENTITY"
          rm -rf -- "$TMPDIR"
  native-pure:
    name: Native XCTest and loopback RFB (validation only)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check hosted ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          # Test-lane floors, not exact pins: hosted images move SDK/cmake patch
          # versions (image 20261013 broke main at 24111f1). Release builds
          # keep their own exact toolchain record; this lane logs what it used.
          xcode_major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          test "${xcode_major:-0}" -ge 26
          sdk_major="$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)"
          test "${sdk_major:-0}" -ge 26
          cmake_major="$(cmake --version | sed -n '1s/^cmake version \([0-9]*\).*/\1/p')"
          test "${cmake_major:-0}" -ge 4
          xcrun --sdk macosx --show-sdk-version
          python3 --version
          xcodebuild -version
          cmake --version
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
      - name: Prepare pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tools="$RUNNER_TEMP/fruitctl-xcodegen-2.46.0"
          mkdir -m 700 "$tools"
          curl --fail --show-error --silent --location --connect-timeout 15 --max-time 90 \
            --output "$tools/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' \
            4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 \
            "$tools/xcodegen.zip" | shasum --algorithm 256 --check --status
          /usr/bin/ditto -x -k "$tools/xcodegen.zip" "$tools"
          test "$("$tools/xcodegen/bin/xcodegen" --version)" = 'Version: 2.46.0'
          printf '%s\n' "$tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build unsigned controller and run two pure suites
        id: native-build
        env:
          FRUITCTL_NATIVE_CI_OUTPUT: ${{ runner.temp }}/fruitctl-native-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-native.sh \
            --output-dir "$FRUITCTL_NATIVE_CI_OUTPUT" \
            --jobs 1 \
            --build-scheme claude-kvm-daemon \
            --test-scheme VNCReconnectTests \
            --test-scheme NativeBehaviorTests \
            --source-revision "$GITHUB_SHA"
      - name: Exercise native synthetic loopback RFB
        id: native-rfb
        timeout-minutes: 5
        env:
          FRUITCTL_NATIVE_CI_OUTPUT: ${{ runner.temp }}/fruitctl-native-${{ github.run_id }}-${{ github.run_attempt }}
          FRUITCTL_RFB_CI_OUTPUT: ${{ runner.temp }}/fruitctl-rfb-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I - "$FRUITCTL_NATIVE_CI_OUTPUT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          output = Path(sys.argv[1])
          receipt_bytes = (output / "build-receipt.json").read_bytes()
          receipt = json.loads(receipt_bytes)
          daemon = output / "unstripped-unsigned/claude-kvm-daemon"
          expected = receipt["unstrippedUnsignedArtifacts"]["claude-kvm-daemon"]
          assert receipt["status"] == "passed"
          assert daemon.is_file() and not daemon.is_symlink()
          assert daemon.stat().st_size == expected["bytes"]
          assert hashlib.sha256(daemon.read_bytes()).hexdigest() == expected["sha256"]
          print(json.dumps({"buildReceiptSha256": hashlib.sha256(receipt_bytes).hexdigest(),
                            "sourceRevision": receipt["sourceRevision"],
                            "sourceTreeSha256": receipt["sourceTreeSha256"],
                            "unstrippedDaemon": expected}, sort_keys=True))
          PY
          python3 -I test/fruitctl-rfb-integration.py \
            --daemon "$FRUITCTL_NATIVE_CI_OUTPUT/unstripped-unsigned/claude-kvm-daemon" \
            --output-dir "$FRUITCTL_RFB_CI_OUTPUT" \
            --captures 100
      - name: Report failed native command
        if: failure()
        env:
          FRUITCTL_NATIVE_CI_OUTPUT: ${{ runner.temp }}/fruitctl-native-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$FRUITCTL_NATIVE_CI_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          output = Path(sys.argv[1])
          receipt = output / "build-receipt.json"
          if receipt.is_file():
              value = json.loads(receipt.read_text())
              print("Native build:", value.get("status"), value.get("failureClass", ""))
              label = (value.get("commands") or [{}])[-1].get("label")
              if isinstance(label, str) and Path(label).name == label:
                  log = output / "logs" / (label + ".log")
                  if log.is_file():
                      print("Final command:", label, "(last 60 lines, at most 16 KiB)")
                      with log.open("rb") as stream:
                          stream.seek(max(0, log.stat().st_size - 16384))
                          print("\n".join(stream.read(16384).decode("utf-8", errors="replace").splitlines()[-60:]))
          PY
      - name: Report build receipt and XCTest summaries
        if: always()
        env:
          FRUITCTL_NATIVE_CI_OUTPUT: ${{ runner.temp }}/fruitctl-native-${{ github.run_id }}-${{ github.run_attempt }}
          NATIVE_BUILD_OUTCOME: ${{ steps.native-build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$NATIVE_BUILD_OUTCOME" = success; then
            python3 -I - "$FRUITCTL_NATIVE_CI_OUTPUT/build-receipt.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          report = {key: value[key] for key in ("status", "sourceRevision", "sourceTreeSha256", "inputManifestSha256")}
          report["sourceFileCount"] = len(value["sourceFiles"])
          report["tests"] = [{key: test[key] for key in ("scheme", "status")} for test in value["tests"]]
          print(json.dumps(report, sort_keys=True))
          PY
          fi
          for scheme in VNCReconnectTests NativeBehaviorTests; do
            bundle="$FRUITCTL_NATIVE_CI_OUTPUT/$scheme.xcresult"
            if test -d "$bundle"; then
              xcrun xcresulttool get test-results summary --path "$bundle"
            elif test "$NATIVE_BUILD_OUTCOME" = success; then
              printf '::error::Missing XCTest result bundle: %s\n' "$scheme"
              exit 1
            fi
          done
      - name: Report synthetic RFB receipts and bounded failure diagnostics
        if: always()
        env:
          FRUITCTL_RFB_CI_OUTPUT: ${{ runner.temp }}/fruitctl-rfb-${{ github.run_id }}-${{ github.run_attempt }}
          NATIVE_RFB_OUTCOME: ${{ steps.native-rfb.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$FRUITCTL_RFB_CI_OUTPUT" "$NATIVE_RFB_OUTCOME" <<'PY'
          import json
          from pathlib import Path
          import sys
          output, outcome = Path(sys.argv[1]), sys.argv[2]
          receipt_path = output / "receipt.json"
          if receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text())
              keys = ("status", "proofKind", "daemonSha256", "fixtureSha256", "rfbVersion", "authentication",
                      "credentialDelivery", "frameDimensions", "startedAtUnixSeconds", "finishedAtUnixSeconds", "failure")
              report = {key: receipt[key] for key in keys if key in receipt}
              report["scenarios"] = []
              for mode in ("full", "partial", "truncated", "silent"):
                  path = output / ("native-" + mode + ".json")
                  if not path.is_file():
                      continue
                  scenario = json.loads(path.read_text())
                  keys = ("transport", "scenario", "status", "route", "processExitCode", "coordinateRoundtrips",
                          "buttonAndKeyReleaseRoundtrip", "refusal", "silentCaptureRefusal",
                          "optionCommandComboKeyEvents", "fixtureErrors", "failure")
                  summary = {key: scenario[key] for key in keys if key in scenario}
                  summary["recordedCaptures"] = len(scenario["captures"])
                  report["scenarios"].append(summary)
              print(json.dumps(report, sort_keys=True))
          elif outcome == "success":
              raise RuntimeError("successful synthetic fixture omitted receipt.json")
          if outcome == "failure":
              for mode in ("full", "partial", "truncated", "silent"):
                  path = output / ("native-" + mode + ".stderr.txt")
                  if path.is_file():
                      print("Native", mode, "stderr (last 40 lines, at most 16 KiB)")
                      with path.open("rb") as stream:
                          stream.seek(max(0, path.stat().st_size - 16384))
                          print("\n".join(stream.read(16384).decode("utf-8", errors="replace").splitlines()[-40:]))
          PY
      - name: Preserve public synthetic JSON and PNG evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fruitctl-native-rfb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fruitctl-native-${{ github.run_id }}-${{ github.run_attempt }}/build-receipt.json
            ${{ runner.temp }}/fruitctl-native-${{ github.run_id }}-${{ github.run_attempt }}/unstripped-unsigned/claude-kvm-daemon
            ${{ runner.temp }}/fruitctl-rfb-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/fruitctl-rfb-${{ github.run_id }}-${{ github.run_attempt }}/*.png
          if-no-files-found: warn
          retention-days: 7
